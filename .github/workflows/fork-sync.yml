name: Fork Sync

on:
  schedule:
    - cron: "*/30 * * * *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/jlbousing/nextjs-ayudemos-venezuela.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
